name: One-time artifact cleanup

on:
  push:
    paths:
      - ".github/workflows/one-time-artifact-cleanup.yml"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove older build downloads and preserve milestone artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const keep = new Set([14522030210,14521486728,14520503803]);
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );
            const protectedArtifacts = artifacts.filter(a => keep.has(a.id));
            const deletions = artifacts.filter(a => !keep.has(a.id));
            core.info(`Found ${artifacts.length} artifacts.`);
            core.info(`Preserving ${protectedArtifacts.length} milestone artifacts:`);
            for (const artifact of protectedArtifacts) {
              core.info(`KEEP ${artifact.id} ${artifact.name}`);
            }
            for (const artifact of deletions) {
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id
              });
              core.info(`DELETED ${artifact.id} ${artifact.name}`);
            }
            core.notice(`Cleanup complete: deleted ${deletions.length}; preserved ${protectedArtifacts.length}.`);
