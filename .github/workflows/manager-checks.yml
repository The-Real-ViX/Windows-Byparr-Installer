name: Manager checks

on:
  push:
    paths:
      - "manager/**"
      - ".github/workflows/manager-checks.yml"
  pull_request:
    paths:
      - "manager/**"
      - ".github/workflows/manager-checks.yml"
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13"]

    defaults:
      run:
        working-directory: manager

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install manager and development tools
        run: python -m pip install -e ".[dev]"

      - name: Apply Ruff import formatting
        run: python -m ruff check --fix .

      - name: Lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen
